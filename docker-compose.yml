# SmartStore local infrastructure.
# Values come from the .env file next to this file (copy .env.example -> .env).
# Every ${VAR:-default} falls back to the default if .env is missing.
# The 4 APIs will be added to this file in step 12.

name: smartstore

services:
  # Catalog API store (products). No auth - local demo only.
  mongo:
    image: mongo:7
    container_name: smartstore-mongo
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db

  # Orders API store. "--appendonly yes" turns on AOF persistence so orders
  # survive a container restart (the brief asks for persistence enabled).
  redis:
    image: redis:7-alpine
    container_name: smartstore-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data

  # Payments API store. The database is created automatically on first start.
  postgres:
    image: postgres:16-alpine
    container_name: smartstore-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smartstore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartstore}
      POSTGRES_DB: ${POSTGRES_DB:-paymentsdb}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # Notifications API store. The SA password must be at least 8 chars with
  # upper, lower, digit and symbol, or the container exits on startup.
  # The NotificationsDb database itself is created by the API (EnsureCreated, step 11).
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: smartstore-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQLSERVER_SA_PASSWORD:-SmartStore@12345}
    ports:
      - "${SQLSERVER_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql

  # Message broker for MassTransit.
  # 5672 = AMQP port the APIs connect to; 15672 = management UI (http://localhost:15672).
  rabbitmq:
    image: rabbitmq:3-management
    container_name: smartstore-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_UI_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

# Named volumes keep data between "docker compose down" / "up".
# "docker compose down -v" wipes them for a clean start.
volumes:
  mongo-data:
  redis-data:
  postgres-data:
  sqlserver-data:
  rabbitmq-data:
